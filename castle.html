<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Static site, all logic in the browser. Scripts only from this origin;
         network only to Zerion and the public RPC; images (logos) from https.
         The dev server adds ws: for hot reload (vite.config.ts), never a build.
         Workers (the player's level, worked out off the main thread) only
         from this origin too. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' blob: data: https://api.zerion.io https://ethereum-rpc.publicnode.com https://base-rpc.publicnode.com https://arbitrum-one-rpc.publicnode.com https://optimism-rpc.publicnode.com https://eth.llamarpc.com https://rpc.ankr.com https://eth.drpc.org https://cloudflare-eth.com https://mainnet.infura.io https://*.g.alchemy.com https://*.quiknode.pro https://rpc.flashbots.net https://*.blastapi.io; object-src 'none'; base-uri 'none'"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <meta name="theme-color" content="#2b2a33" />
    <link rel="manifest" href="/castle.webmanifest" />
    <link rel="apple-touch-icon" href="/themes/medieval-castle/art/app/icon.192.png" />
    <title>Wallet-landia · Castle</title>
    <link rel="stylesheet" href="/src/castle/shell.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/castle/main.ts"></script>
  </body>
</html>
