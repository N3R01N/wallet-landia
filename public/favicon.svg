<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Wallet-landia: the Chronicle Tower, its beacon burning, on a wooden tile -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#3f2615"/>
  <rect x="1" y="1" width="30" height="30" rx="5" fill="#6b4226"/>
  <!-- night sky, a few stars -->
  <rect x="2" y="2" width="28" height="22" rx="4" fill="#1d2a4a"/>
  <rect x="5" y="6" width="1" height="1" fill="#f6e7c1"/>
  <rect x="26" y="5" width="1" height="1" fill="#f6e7c1"/>
  <rect x="24" y="12" width="1" height="1" fill="#f6e7c1"/>
  <rect x="7" y="14" width="1" height="1" fill="#f6e7c1"/>
  <!-- meadow -->
  <rect x="2" y="23" width="28" height="7" rx="3" fill="#4a8a3a"/>
  <rect x="2" y="23" width="28" height="2" fill="#5fae48"/>
  <!-- the beacon: a glow, the flame, its white-hot heart -->
  <rect x="13" y="1" width="6" height="6" fill="#f5c518" opacity="0.35"/>
  <rect x="15" y="1" width="2" height="1" fill="#ffe680"/>
  <rect x="14" y="2" width="4" height="3" fill="#f5c518"/>
  <rect x="15" y="3" width="2" height="2" fill="#fff6dc"/>
  <rect x="13" y="5" width="6" height="1" fill="#2a2628"/>
  <!-- spire roof -->
  <rect x="15" y="6" width="2" height="1" fill="#2a58b0"/>
  <rect x="14" y="7" width="4" height="1" fill="#2a58b0"/>
  <rect x="13" y="8" width="6" height="1" fill="#2a58b0"/>
  <rect x="12" y="9" width="8" height="1" fill="#1e4290"/>
  <rect x="11" y="10" width="10" height="1" fill="#1e4290"/>
  <!-- tower: stone, shaded on the right -->
  <rect x="11" y="11" width="10" height="15" fill="#b8b0a2"/>
  <rect x="18" y="11" width="3" height="15" fill="#8e8678"/>
  <rect x="11" y="15" width="10" height="1" fill="#9a9284"/>
  <rect x="11" y="20" width="10" height="1" fill="#9a9284"/>
  <!-- the clock face, and the bell window -->
  <rect x="14" y="12" width="4" height="3" fill="#f6e7c1"/>
  <rect x="15" y="13" width="2" height="1" fill="#3a2414"/>
  <rect x="14" y="16" width="4" height="3" fill="#2a1a10"/>
  <rect x="15" y="17" width="2" height="2" fill="#f5c518"/>
  <!-- the door -->
  <rect x="14" y="22" width="4" height="4" fill="#3a2414"/>
  <rect x="15" y="21" width="2" height="1" fill="#3a2414"/>
  <!-- the queue at the door: two townsfolk -->
  <rect x="7" y="23" width="2" height="3" fill="#a83a32"/>
  <rect x="7" y="22" width="2" height="1" fill="#e0b48a"/>
  <rect x="23" y="23" width="2" height="3" fill="#2a58b0"/>
  <rect x="23" y="22" width="2" height="1" fill="#e0b48a"/>
</svg>
